<title>Kronkoll</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Glass panels floating over a live liquid map of the month's money. One idea per panel. */
:root{--desk:#e8ecf3;--paper:#ffffff;--glass:rgba(255,255,255,.74);--glass2:rgba(255,255,255,.62);--rule:rgba(24,36,66,.12);--ink:#141c30;--soft:#515d75;--pen:#2747b8;--c1:#3556a8;--c2:#2c8a5c;--c3:#c98a1e;--c4:#c04f7c;--good:#1c6d46;--warn:#855208;--bad:#ad2f2f;--f1:#7d9bf0;--f2:#55c99a;--f3:#f4b45c;--fbg:#e8ecf3;--dk:0;--hand:"Bricolage Grotesque",Figtree,system-ui,sans-serif;--ui:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;--shadow:0 12px 34px rgba(24,36,66,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#090d15;--paper:#121927;--glass:rgba(14,20,32,.72);--glass2:rgba(14,20,32,.6);--rule:rgba(226,235,255,.13);--ink:#edf2fb;--soft:#a7b3c9;--pen:#a7bffa;--c1:#6688dc;--c2:#3b9f70;--c3:#b98a2c;--c4:#c9648c;--good:#79dcac;--warn:#efc67a;--bad:#f4a3a3;--f1:#3b62e0;--f2:#14ad7c;--f3:#e08f24;--fbg:#090d15;--dk:1;--shadow:0 14px 40px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--desk:#090d15;--paper:#121927;--glass:rgba(14,20,32,.72);--glass2:rgba(14,20,32,.6);--rule:rgba(226,235,255,.13);--ink:#edf2fb;--soft:#a7b3c9;--pen:#a7bffa;--c1:#6688dc;--c2:#3b9f70;--c3:#b98a2c;--c4:#c9648c;--good:#79dcac;--warn:#efc67a;--bad:#f4a3a3;--f1:#3b62e0;--f2:#14ad7c;--f3:#e08f24;--fbg:#090d15;--dk:1;--shadow:0 14px 40px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{background:radial-gradient(70vmax 60vmax at 15% 10%,color-mix(in srgb,var(--f1) 38%,transparent),transparent),radial-gradient(60vmax 60vmax at 90% 60%,color-mix(in srgb,var(--f2) 30%,transparent),transparent),var(--desk);background-attachment:fixed;color:var(--ink);font:16px/1.45 var(--ui);min-height:100%;margin:0;padding-block:12px calc(112px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden;font-variant-numeric:tabular-nums}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block}

@keyframes rise{from{transform:translateY(10px);opacity:.5}}
.hide{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .15s,background .2s,color .2s}button:active{transform:scale(.96)}
input,select{font:inherit;color:var(--ink);min-width:0}
a{color:var(--pen)}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.top,.sheet,.mnav,nav,#yrs{backdrop-filter:blur(12px) saturate(1.5);-webkit-backdrop-filter:blur(12px) saturate(1.5);background:var(--glass);border:1px solid var(--rule);box-shadow:var(--shadow)}
.top{display:flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;border-radius:18px}
.menu{width:44px;height:44px;border:0;background:none;padding:0;display:grid;place-items:center}
h1{font:650 25px/1.1 var(--hand);letter-spacing:-.02em;margin:0;text-wrap:balance}
.sheet{min-width:0;padding:18px;border-radius:22px}
.lbl{font-size:14px;color:var(--soft)}
.big{font:700 54px/1.02 var(--hand);letter-spacing:-.035em;overflow-wrap:anywhere}
.head{font:650 21px/1.2 var(--hand);letter-spacing:-.015em;margin:0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:10px;border-bottom:1px solid var(--rule)}
.row:first-child{padding-top:0}.row:last-child{border-bottom:0;padding-bottom:0}
.row>span{min-width:0}.row b{font:650 18px/1.2 var(--ui);white-space:nowrap}
.ok{color:var(--good)}.wn{color:var(--warn)}.er{color:var(--bad)}
.stack{display:flex;gap:3px;height:12px;margin-top:18px}
.stack i{display:block;min-width:3px;border-radius:3px;transition:flex-grow .5s}.stack i:first-child{border-radius:8px 3px 3px 8px}.stack i:last-child{border-radius:3px 8px 8px 3px}
.keys{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:14px;color:var(--soft)}
.keys b{font-weight:650;color:var(--ink)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.btn{border:0;border-radius:14px;padding:12px 14px;font-weight:700;color:var(--paper);background:var(--ink);min-height:48px}
.btn.out{background:var(--glass);color:var(--ink);border:1px solid var(--rule);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.lnk{border:0;background:none;padding:8px 0;color:var(--pen);font-size:15px;font-weight:650;text-align:left}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px;border-radius:18px}
.mnav b{font:650 21px/1.2 var(--hand);letter-spacing:-.015em;text-align:center}
.mnav button{width:44px;height:44px;border:0;border-radius:14px;background:none;font-size:22px;padding:0}
.now{display:block;margin:0 auto;padding:6px 14px;border-radius:99px;background:var(--glass)}
details>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;min-height:44px}

.sumv{margin-left:auto;font:650 18px/1 var(--ui);white-space:nowrap}
.ln{display:grid;grid-template-columns:minmax(0,1fr) 92px 30px;align-items:center;gap:6px;border-bottom:1px solid var(--rule)}
.ln input{border:0;background:none;height:46px;padding:0;font:500 17px/1 var(--ui);width:100%;border-radius:0}
.ln input:focus{outline:0;box-shadow:inset 0 -2px 0 var(--pen)}
.ln .am{text-align:right;font-weight:650}
.ln input::placeholder{color:var(--soft)}
.x{border:0;background:none;color:var(--soft);height:44px;padding:0;font-size:13px}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}input[type=number]{-moz-appearance:textfield;appearance:textfield}
.spst{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:48px;font-size:14px;color:var(--soft);border-bottom:1px solid var(--rule)}
.mini{flex:none;min-height:36px;padding:4px 12px;border-radius:99px;border:0;background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);font-size:14px;font-weight:700}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:14px}
.total span{font-weight:600}.total b{font:700 28px/1 var(--hand);letter-spacing:-.02em;white-space:nowrap}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.form>*{min-width:0}.span2{grid-column:1/-1}
.form input,.form select{width:100%;height:48px;padding:0 12px;border:1px solid var(--rule);border-radius:14px;background:var(--glass2)}
.note{font-size:14px;color:var(--soft);margin:8px 0 0}
.bar{height:8px;border-radius:99px;background:var(--rule);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--c2);border-radius:99px;transition:width .5s}
.cols{display:flex;align-items:flex-end;gap:5px;height:92px;margin-top:14px}.cols div{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--soft)}.cols i{display:block;border-radius:5px 5px 2px 2px;background:var(--rule);min-height:3px;margin-bottom:4px;transition:height .5s}
.dep{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-block:6px;border-bottom:1px solid var(--rule);font-size:15px}.dep:last-child{border:0}.dep span{min-width:0}
.find{display:grid;grid-template-columns:26px minmax(0,1fr);gap:4px 8px;padding-block:13px;border-bottom:1px solid var(--rule)}.find:last-child{border:0;padding-bottom:0}
.find u{text-decoration:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:13px;font-weight:700}
.find b{font-weight:650}.find p{grid-column:2;margin:0;font-size:15px;color:var(--soft)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:13px;font-weight:600;color:var(--soft);text-align:right;padding:6px 0 6px 10px;border-bottom:1px solid var(--rule)}th:first-child,td:first-child{text-align:left;padding-left:0}
td{text-align:right;padding:9px 0 9px 10px;border-bottom:1px solid var(--rule);font-size:15px;white-space:nowrap}td:first-child{white-space:normal}
tr:last-child td{border-bottom:0}
tr.sub td{font-size:14px;color:var(--soft)}tr.sub td:first-child{padding-left:12px}
.stamp{display:inline-block;padding:4px 11px;border-radius:99px;border:1px solid currentColor;font-size:13px;font-weight:650}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.links a{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:14px;background:var(--ink);color:var(--paper);font-weight:700;text-decoration:none;text-align:center;padding:4px}
.fee{padding-block:11px;border-bottom:1px solid var(--rule)}.fee:last-child{border:0}.fee .bar i{background:var(--c1)}.fee .bar{background:none}.fee small{display:block;color:var(--soft);font-size:13px;margin-top:4px}
.src a{display:block;padding:6px 0;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}.chips:last-child{margin-bottom:0}.chip{padding:9px 15px;border-radius:99px;border:1px solid var(--rule);background:none;font-size:14px;font-weight:600}.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:6px;font-size:15px}.set input{width:96px;height:44px;text-align:right;padding:0 12px;border:1px solid var(--rule);border-radius:12px;background:var(--glass2)}
.adv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.adv label{font-size:13px;color:var(--soft)}.adv input{width:100%;height:44px;padding:0 12px;border:1px solid var(--rule);border-radius:12px;background:var(--glass2)}
.hint{font-size:14px;color:var(--soft);margin-top:8px}.hint.w{color:var(--warn)}.hint.b{color:var(--bad)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)),480px);display:flex;gap:2px;padding:5px;border-radius:24px;z-index:20}
nav button{flex:1;min-width:0;min-height:56px;border:0;background:none;color:var(--soft);font-size:11.5px;font-weight:650;padding:6px 0 4px;border-radius:19px}
nav svg{display:block;width:22px;height:22px;margin:0 auto 3px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:var(--ink);color:var(--paper)}
#yrs{position:fixed;width:150px;z-index:25;border-radius:20px;overflow:hidden;transform-origin:bottom center;transform:translateY(24px) scale(.72,.2);opacity:0;pointer-events:none;transition:transform .3s cubic-bezier(.2,1.15,.3,1),opacity .16s}
#yrs.on{transform:none;opacity:1;pointer-events:auto}
#yrs p{margin:0;padding:12px 14px 8px;font-size:13px;font-weight:600;color:var(--soft);text-align:center}
#yr_list{max-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 6px 6px;position:relative}
#yr_list button{display:block;width:100%;height:48px;border:0;border-radius:13px;background:none;font:650 20px/1 var(--hand)}
#yr_list button.on{background:var(--ink);color:var(--paper)}
#scrim{position:fixed;inset:0;background:rgba(5,10,20,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(80%,300px);transform:translateX(-105%);transition:transform .32s cubic-bezier(.2,.9,.3,1);z-index:31;background:var(--paper);border-right:1px solid var(--rule);padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:4px}
#drawer.on{transform:none}
#drawer>button{text-align:left;border:0;background:none;font-weight:600;padding:13px 12px;border-radius:14px}#drawer>button.on{background:var(--ink);color:var(--paper)}
#drawer h2{font:700 24px var(--hand);letter-spacing:-.02em;margin:0 12px 10px}#drawer small{margin-top:auto;padding:0 12px;color:var(--soft)}
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(5,10,20,.55);opacity:0;pointer-events:none;transition:opacity .2s}#modal.on{opacity:1;pointer-events:auto}
.mbox{width:min(100%,400px);background:var(--paper);border:1px solid var(--rule);border-radius:22px;padding:22px}.mbox b{font:650 21px var(--hand)}.mbox p{color:var(--soft);font-size:15px;margin:8px 0 16px}.mact{display:flex;gap:10px}.mact .btn{flex:1}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));width:min(calc(100% - 32px),420px);z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 16px;border-radius:14px;background:var(--ink);color:var(--paper);font-size:15px;font-weight:600;animation:tin .25s ease,tout .3s 3s forwards}
@keyframes tin{from{transform:translateY(-16px);opacity:0}}@keyframes tout{to{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Phone: one column with a floating tab bar. Tablet (700+): two-column panels. Laptop (1024+): side rail. Wide (1280+): three-column budget. */
.big.verdict{font-size:38px}
.sheet>.head{margin-bottom:10px}
.mnavw{min-width:0}
nav .more{display:none}
.note,.find p{max-width:68ch}
@media (hover:hover){.btn:hover,.links a:hover{opacity:.88}nav button:not(.on):hover,#drawer>button:not(.on):hover,.mnav button:hover,#yr_list button:not(.on):hover{background:var(--rule);color:var(--ink)}.lnk:hover{text-decoration:underline}}
@media (min-width:700px){
  main{max-width:900px}
  section{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
  section>*{grid-column:1/-1;min-width:0}
  .sheet{padding:22px}
  .big{font-size:clamp(60px,6.4vw,92px)}.big.verdict{font-size:clamp(40px,4.4vw,58px)}
  .mnavw{width:100%;max-width:440px;justify-self:center}
  .cols{height:156px}
  #h>:nth-child(2){grid-column:span 7}#h>:nth-child(3){grid-column:span 5;align-content:center}#h>.btn{justify-self:start;min-width:260px}
  #b>:nth-child(2),#b>:nth-child(3),#b>:nth-child(4),#b>:nth-child(5){grid-column:span 6}
  #b details>summary{cursor:default}#b details>summary::after{display:none}
  #s_per{order:-1}#s>:nth-child(1){grid-column:span 5}#s>:nth-child(3){grid-column:span 7}#s>:nth-child(5){grid-column:span 7}#s>:nth-child(6){grid-column:span 5}
  #r>:nth-child(2),#r>:nth-child(3){align-self:start}#r>:nth-child(4),#r>:nth-child(5){grid-column:span 6;align-self:start}
  #m>:nth-child(2),#m>:nth-child(3){grid-column:span 6}#m>:nth-child(4),#m>:nth-child(5){grid-column:span 6}
  #m .links{max-width:440px}
  #e>:nth-child(2),#x>:nth-child(1){grid-column:span 5}#e>:nth-child(3),#x>:nth-child(2){grid-column:span 7}
  #c>:nth-child(1),#c>:nth-child(2){grid-column:span 6}
}
@media (min-width:860px){#r>:nth-child(2),#r>:nth-child(3){grid-column:span 6}}
@media (min-width:1024px){
  body{padding-left:calc(248px + env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:16px 24px}
  main{max-width:1180px;gap:14px}
  .menu{display:none}.top{padding:12px 20px}h1{font-size:30px}
  nav{left:max(16px,env(safe-area-inset-left,0px));top:16px;bottom:16px;transform:none;width:216px;flex-direction:column;gap:4px;padding:12px 10px}
  nav::before{content:"Kronkoll";font:750 24px/1 var(--hand);letter-spacing:-.03em;padding:8px 12px 18px}
  nav button{flex:none;display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;font-size:15px;border-radius:14px;text-align:left}
  nav svg{margin:0;flex:none}
  nav .more{display:flex}nav .more.first{margin-top:auto}
  #yrs{transform-origin:left center;transform:translateX(-18px) scale(.2,.72)}
  #b .form{grid-template-columns:minmax(0,2fr) minmax(0,2fr) minmax(0,1fr) minmax(0,1fr)}
}
@media (min-width:1280px){
  #r>:nth-child(2){grid-column:span 7}#r>:nth-child(3){grid-column:span 5}
  #m>:nth-child(2){grid-column:span 5}#m>:nth-child(3){grid-column:span 7}#m>:nth-child(4){grid-column:span 7}#m>:nth-child(5){grid-column:span 5}
}

/* Budget lines as soft tiles, with a calm red remove button. */
.lnw{background:var(--glass2);border:1px solid var(--rule);border-radius:14px;padding:1px 7px 1px 14px;margin-top:7px;transition:border-color .2s,box-shadow .2s}
.lnw:focus-within{border-color:var(--pen);box-shadow:0 0 0 3px color-mix(in srgb,var(--pen) 16%,transparent)}
.ln{grid-template-columns:minmax(0,1fr) auto 32px;gap:8px;border-bottom:0}
.ln input:focus{box-shadow:none}
.amw{display:flex;align-items:baseline;gap:5px}.ln .am{width:5.4em;font-size:17px}.amw span{font-size:14px;color:var(--soft)}
.x{width:32px;height:32px;border-radius:50%;background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);display:grid;place-items:center;padding:0}
.x svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;fill:none}
.spst{border-bottom:0;border-top:1px solid var(--rule);min-height:46px;padding-right:2px}
#l_inc,#l_items,#l_vars,#l_split{margin-top:2px}
.sub2{display:block;font-size:13px;color:var(--soft);font-weight:500}
@media (hover:hover){.x:hover{background:color-mix(in srgb,var(--bad) 22%,transparent)}}
/* The year summary on Overview. */
.yhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ynav{display:flex;gap:4px}.ynav button{width:40px;height:40px;border:0;border-radius:12px;background:var(--rule);font-size:20px;padding:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.tile{background:var(--glass2);border:1px solid var(--rule);border-radius:14px;padding:12px;min-width:0}.tile b{display:block;font:700 23px/1.15 var(--hand);letter-spacing:-.02em;margin-top:3px;overflow-wrap:anywhere}
.ybars{display:flex;align-items:flex-end;gap:4px;height:150px;margin-top:18px}
.ymo{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;border:0;background:none;padding:0;font-size:12px;color:var(--soft)}
.ymo.cur{color:var(--ink);font-weight:750}
.ymo .st{display:flex;flex-direction:column-reverse;gap:2px}.ymo i{display:block;min-height:2px}.ymo .st i:last-child{border-radius:4px 4px 0 0}.ymo .none{height:2px;background:var(--rule)}
.ytable{margin-top:14px}
.ytable th,.ytable td{font-size:13px;padding:8px 0 8px 12px}.ytable .tot{font-weight:700}
.ytable th:first-child,.ytable td:first-child{position:sticky;left:0;background:var(--paper);padding-right:10px;min-width:104px;white-space:nowrap;z-index:1}
.ytable tr.sum td{font-weight:650}
.ytable th.cur{color:var(--ink)}

(async()=>{try{
